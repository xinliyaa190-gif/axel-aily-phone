
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Aily's iPhone</title>
<style>
*{box-sizing:border-box}
:root{--pink:#f5c9d8;--ink:#222}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#fbe5ed,#e8d9e7 58%,#c9d5e7);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:white;display:flex;align-items:center;justify-content:center;padding:18px 8px}
.phone{width:min(390px,100%);height:min(820px,94dvh);min-height:570px;background:#080808;border:3px solid #555;border-radius:52px;padding:9px;box-shadow:0 24px 70px #3c253955,0 0 0 2px #111;position:relative;overflow:hidden}
.screen{height:100%;width:100%;border-radius:42px;overflow:hidden;position:relative;background:linear-gradient(150deg,#f8dce5,#d9d5ed 52%,#f8e6d9);isolation:isolate}
.wallpaper{position:absolute;inset:0;z-index:-1;background:radial-gradient(ellipse at 20% 25%,#fff8 0 8%,transparent 35%),radial-gradient(ellipse at 85% 75%,#f8a8c566 0 13%,transparent 42%),linear-gradient(145deg,#f9dce6,#d7d5f1 55%,#f5d9d1)}
.status{height:34px;padding:10px 24px 0;display:flex;justify-content:space-between;align-items:center;color:#29212c;font-size:12px;font-weight:750}
.status-right{display:flex;align-items:center;gap:5px}
.signal{letter-spacing:-3px;font-size:15px}.battery{width:19px;height:10px;border:1.4px solid;border-radius:3px;position:relative}
.battery:before{content:"";position:absolute;left:2px;top:2px;width:12px;height:4px;background:currentColor;border-radius:1px}
.battery:after{content:"";position:absolute;right:-3px;top:2px;width:2px;height:4px;background:currentColor;border-radius:0 2px 2px 0}
.island{position:absolute;top:8px;left:50%;transform:translateX(-50%);height:27px;width:100px;background:#050505;border-radius:20px;z-index:20}
.lock{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;padding:70px 20px 30px;text-align:center;color:#fff;background:linear-gradient(160deg,#e6bfd3aa,#aaa7d9aa 60%,#e9c4d1aa)}
.lock-date{font-size:15px;text-shadow:0 1px 8px #655}
.lock-time{font-size:78px;font-weight:250;letter-spacing:-4px;line-height:1.15;text-shadow:0 2px 15px #6656}
.lock-bottom{margin-top:auto;font-size:13px;text-shadow:0 1px 8px #555}
.unlock{border:1px solid #ffffff9c;background:#ffffff30;color:white;border-radius:30px;padding:12px 25px;margin-top:20px;font-size:14px}
.home{height:calc(100% - 34px);padding:9px 13px 13px;display:flex;flex-direction:column;color:#29232f}
.top-widgets{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.widget{border:1px solid #ffffffa8;background:#ffffff8a;color:#29232f;border-radius:23px;padding:13px;box-shadow:0 5px 18px #70526c12;backdrop-filter:blur(18px);min-width:0}
.widget .small{font-size:10px;opacity:.7;font-weight:650;letter-spacing:.2px}
.bigtime{font-size:31px;font-weight:600;letter-spacing:-1.4px;margin:4px 0}
.date{font-size:12px;font-weight:600}
.weather{display:flex;align-items:center;gap:8px;margin-top:7px}
.weather-icon{font-size:30px}.temp{font-size:25px;font-weight:550;letter-spacing:-1px}
.forecast{font-size:10px;opacity:.72;margin-top:2px}
.calendar{margin-top:10px;display:flex;gap:10px;align-items:center}
.caldate{width:42px;height:45px;border-radius:12px;background:#ffffffad;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0}
.caldate b{font-size:20px}.caldate span{font-size:9px;color:#d76b8c;font-weight:800}
.calinfo{font-size:11px;line-height:1.45}.calinfo strong{font-size:12px;display:block}
.camwidget{margin-top:10px;min-height:94px;display:flex;align-items:center;gap:12px}
.cam-preview{height:65px;width:92px;flex-shrink:0;border-radius:14px;background:linear-gradient(145deg,#b6c1c7,#68747e);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cam-preview:before{content:"";position:absolute;width:100px;height:65px;transform:rotate(-20deg);background:repeating-linear-gradient(90deg,#ffffff15 0 2px,transparent 2px 22px)}
.cam-preview:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#28333c66,transparent)}
.cam-lens{height:25px;width:25px;border-radius:50%;border:4px solid #dce0e2;background:#26313c;z-index:1;box-shadow:0 0 0 4px #4d5963}
.cam-copy{font-size:11px;line-height:1.5}.cam-copy strong{display:block;font-size:12px}.live{color:#419a71;font-size:9px;font-weight:800}
.appgrid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:14px;column-gap:7px;margin-top:auto;padding:17px 0 16px}
.app{border:0;background:transparent;padding:0;color:#29232f;display:flex;flex-direction:column;align-items:center;gap:5px;font:inherit;min-width:0;cursor:pointer}
.appicon{height:49px;width:49px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 10px #44334b18;border:1px solid #ffffff75}
.appname{font-size:10px;font-weight:550;text-shadow:0 1px 5px #fff8}
.i-msg{background:linear-gradient(#8fe4a1,#30bc67)}.i-phone{background:linear-gradient(#9de9a5,#32b968)}.i-cam{background:linear-gradient(140deg,#f8f8f8,#bbc3d0)}.i-photo{background:linear-gradient(140deg,#fff,#f6e6e9)}
.i-line{background:#06c755}.i-ig{background:linear-gradient(35deg,#ffb35d,#f04679,#9c52c5)}.i-x{background:#171717;color:white}.i-browser{background:linear-gradient(#9ddaff,#eaf8ff)}.i-note{background:linear-gradient(#fff6b5,#ffe47c)}.i-cal{background:linear-gradient(#fff,#f2dfe5)}.i-music{background:linear-gradient(145deg,#fa9bcb,#bd92f7)}.i-mail{background:linear-gradient(#a9d7ff,#eaf5ff)}.i-alarm{background:linear-gradient(#ded4ff,#b8a7ef)}.i-settings{background:linear-gradient(#e4e5e9,#9ba3ad)}.i-contact{background:linear-gradient(#c2e3ff,#719ed5)}.i-weather{background:linear-gradient(#92d6ff,#eaf8ff)}
.dock{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 9px;border:1px solid #ffffff8c;background:#ffffff65;border-radius:27px;backdrop-filter:blur(20px);margin-top:0}
.dock .appicon{height:46px;width:46px}.dock .appname{display:none}
.home-indicator{width:105px;height:4px;background:#fff;border-radius:10px;position:absolute;bottom:5px;left:50%;transform:translateX(-50%);z-index:25;mix-blend-mode:difference}
.modal{position:absolute;inset:0;z-index:30;background:#f6edf5;color:#29232f;display:none;flex-direction:column}
.modal-head{height:55px;display:flex;align-items:center;justify-content:space-between;padding:0 17px;border-bottom:1px solid #0000000c;font-weight:750;font-size:16px}
.back{border:0;background:#ffffffb5;border-radius:18px;padding:7px 12px;color:#5e5262;font-size:12px}
.content{padding:17px;overflow:auto;flex:1;font-size:14px;line-height:1.5}
.chat{background:white;border-radius:17px 17px 17px 5px;padding:10px 12px;margin:8px 35px 8px 0;box-shadow:0 2px 5px #00000008}
.mine{background:#c9f5d6;border-radius:17px 17px 5px 17px;margin:8px 0 8px 35px}
.chatname{font-size:10px;color:#8a6a7c;font-weight:750;margin-bottom:3px}
.noteinput{width:100%;min-height:160px;border:0;border-radius:16px;padding:13px;font:inherit;background:#fff;color:#222;resize:vertical}
.rowbtn{border:0;background:white;border-radius:13px;padding:12px;margin:5px 0;width:100%;text-align:left;color:#29232f;font:inherit}
.camera-view{flex:1;background:#202329;display:flex;align-items:center;justify-content:center;color:#ddd;flex-direction:column;gap:12px}
.camera-view button{background:#fff;border:0;border-radius:50%;height:60px;width:60px;font-size:22px}
.pinbox{position:absolute;inset:0;z-index:40;background:#f8e8f0;color:#302735;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.pin-dots{display:flex;gap:13px;margin:22px}
.dot{width:10px;height:10px;border:1px solid #6f5665;border-radius:50%}.dot.full{background:#6f5665}
.keypad{display:grid;grid-template-columns:repeat(3,65px);gap:12px;margin-top:10px}
.key{height:55px;border:0;border-radius:50%;background:#ffffffad;color:#302735;font-size:22px}
.pin-hint{font-size:12px;opacity:.65;min-height:18px}
@media(max-height:680px){.phone{height:96dvh;min-height:0}.home{padding:5px 11px 9px}.widget{padding:9px}.appgrid{row-gap:8px;padding:9px 0}.appicon{height:42px;width:42px}.camwidget{min-height:78px}.cam-preview{height:53px}}
</style>
</head>
<body>
<div class="phone">
 <div class="screen">
  <div class="wallpaper"></div>
  <div class="status"><span id="statusTime">9:41</span><span class="status-right"><span class="signal">▂▄▆</span><span>Wi-Fi</span><span class="battery"></span></span></div>
  <div class="island"></div>
  <div class="lock" id="lock">
   <div class="lock-date" id="lockDate">Senin, 19 September</div>
   <div class="lock-time" id="lockTime">09:41</div>
   <div class="lock-bottom">iPhone Aily</div>
   <button class="unlock" onclick="openPin()">↑ &nbsp; Ketuk untuk membuka</button>
  </div>
  <div class="pinbox" id="pinbox">
   <div style="font-size:12px;opacity:.7">MASUKKAN KODE SANDI</div>
   <div style="font-size:18px;font-weight:750;margin-top:9px">iPhone Aily</div>
   <div class="pin-dots" id="pinDots"><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
   <div class="pin-hint" id="pinHint">Masukkan kode sandi</div>
   <div class="keypad" id="keypad"></div>
   <button class="back" style="margin-top:18px" onclick="closePin()">Batal</button>
  </div>
  <div class="home" id="home" style="display:none">
   <div class="top-widgets">
    <div class="widget">
     <div class="small" id="widgetDay">HARI INI</div>
     <div class="bigtime" id="widgetTime">09:41</div>
     <div class="date" id="widgetDate">19 September</div>
    </div>
    <div class="widget">
     <div class="small">CUACA</div>
     <div class="weather"><span class="weather-icon">🌤️</span><div><div class="temp">28°</div><div class="forecast">Cerah berawan</div></div></div>
     <div class="forecast">Karawang · perkiraan</div>
    </div>
   </div>
   <div class="widget calendar">
    <div class="caldate"><span id="calMonth">SEP</span><b id="calDay">19</b></div>
    <div class="calinfo"><strong>Kalender</strong><span id="calendarText">Tidak ada acara hari ini</span></div>
    <div style="margin-left:auto;font-size:23px">🗓️</div>
   </div>
   <div class="widget camwidget" onclick="openApp('Kamera IP')" style="cursor:pointer">
    <div class="cam-preview"><div class="cam-lens"></div></div>
    <div class="cam-copy"><strong>Kamera IP</strong><span class="live">● SIAP</span><div style="opacity:.65;font-size:10px">Pratinjau simulasi</div></div>
    <div style="margin-left:auto;font-size:20px;opacity:.5">›</div>
   </div>
   <div class="appgrid" id="appgrid"></div>
   <div class="dock" id="dock"></div>
  </div>
  <div class="modal" id="modal">
   <div class="modal-head"><button class="back" onclick="closeApp()">‹ Home</button><span id="appTitle">App</span><span style="width:52px"></span></div>
   <div class="content" id="appContent"></div>
  </div>
  <div class="home-indicator"></div>
 </div>
</div>
<script>
const $=id=>document.getElementById(id);
const days=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const months=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function updateClock(){
 const d=new Date(),time=d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',hour12:false});
 $('statusTime').textContent=time;$('lockTime').textContent=time;$('widgetTime').textContent=time;
 $('lockDate').textContent=days[d.getDay()]+', '+d.getDate()+' '+months[d.getMonth()];
 $('widgetDay').textContent=days[d.getDay()].toUpperCase();$('widgetDate').textContent=d.getDate()+' '+months[d.getMonth()];
 $('calMonth').textContent=months[d.getMonth()].slice(0,3).toUpperCase();$('calDay').textContent=d.getDate();
}
updateClock();setInterval(updateClock,15000);
const apps=[
 ['Messages','💬','i-msg'],['Instagram','📷','i-ig'],['Photos','🌸','i-photo'],['Camera','📸','i-cam'],
 ['LINE','LINE','i-line'],['X','𝕏','i-x'],['Browser','🌐','i-browser'],['Mail','✉️','i-mail'],
 ['Calendar','🗓️','i-cal'],['Notes','📝','i-note'],['Music','♫','i-music'],['Weather','🌤️','i-weather'],
 ['Contacts','👤','i-contact'],['Alarm','⏰','i-alarm'],['Settings','⚙️','i-settings'],['Phone','📞','i-phone']
];
const dockNames=['Phone','Messages','Browser','Music'];
function appButton(a){return `<button class="app" onclick="openApp('${a[0]}')"><span class="appicon ${a[2]}">${a[1]}</span><span class="appname">${a[0]}</span></button>`}
$('appgrid').innerHTML=apps.filter(a=>!dockNames.includes(a[0])).map(appButton).join('');
$('dock').innerHTML=dockNames.map(n=>appButton(apps.find(a=>a[0]===n))).join('');
function openPin(){$('pinbox').style.display='flex';$('lock').style.display='none';pin='';renderDots()}
function closePin(){$('pinbox').style.display='none';$('lock').style.display='flex';pin=''}
let pin='';
function renderDots(){$('pinDots').innerHTML=[0,1,2,3].map(i=>`<span class="dot ${i<pin.length?'full':''}"></span>`).join('')}
function makeKeys(){
 const nums=['1','2','3','4','5','6','7','8','9','⌫','0','OK'];
 $('keypad').innerHTML=nums.map(n=>`<button class="key" onclick="pressKey('${n}')">${n}</button>`).join('');
}
makeKeys();
function pressKey(k){
 if(k==='⌫')pin=pin.slice(0,-1);
 else if(k==='OK'){checkPin();return}
 else if(pin.length<4)pin+=k;
 renderDots();if(pin.length===4)checkPin();
}
function checkPin(){
 if(pin==='1909'){$('pinbox').style.display='none';$('home').style.display='flex';}
 else{$('pinHint').textContent='Kode sandi salah';pin='';renderDots()}
}
function openApp(name){
 $('modal').style.display='flex';$('appTitle').textContent=name;
 const c=$('appContent');c.innerHTML='';
 const btn=(txt,fn)=>`<button class="rowbtn" onclick="${fn}">${txt}</button>`;
 if(name==='Messages'||name==='LINE'){
 c.innerHTML=`<div style="font-size:12px;color:#96788c;margin-bottom:12px">Percakapan</div>
 <div class="chat"><div class="chatname">Axel</div>Besok latihan basket. Jangan telat.</div>
 <div class="chat mine"><div class="chatname">Aily</div>emang aku pernah telat?</div>
 <div class="chat"><div class="chatname">Axel</div>Mau aku jawab jujur?</div>
 <div class="chat mine"><div class="chatname">Aily</div>gausah. ga jadi nanya.</div>
 <div class="chat"><div class="chatname">Axel</div>Berisik.</div>
 <div class="chat mine"><div class="chatname">Aily</div>YA UDAH DIEM 😭</div>`;
 }else if(name==='Instagram'){
 c.innerHTML=`<div style="font-size:20px;font-weight:800;margin-bottom:18px">Instagram</div><div class="widget" style="background:white"><div style="display:flex;gap:10px;align-items:center"><div style="background:#f4c7d9;border-radius:50%;padding:10px">🌻</div><b>aily.v</b></div><div style="height:180px;border-radius:15px;background:linear-gradient(145deg,#f8d7e4,#d5d7f3);display:flex;align-items:center;justify-content:center;font-size:52px;margin-top:12px">🌻</div><p>♡  ♡  ♡</p><div>sunny day ☁️</div></div>`;
 }else if(name==='Photos'){
 c.innerHTML=`<h3>Recents</h3><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:5px">${['🌻','🏀','🌇','🎀','☁️','📸','🌷','🎧','🩰'].map((e,i)=>`<div style="aspect-ratio:1;background:${['#f4d6e2','#d7dff2','#f2e4d0'][i%3]};border-radius:9px;display:grid;place-items:center;font-size:30px">${e}</div>`).join('')}</div>`;
 }else if(name==='Camera'||name==='Kamera IP'){
 c.innerHTML=`<div class="camera-view" style="min-height:330px;border-radius:18px"><div style="font-size:13px">Pratinjau kamera simulasi</div><div style="font-size:44px">📷</div><button onclick="alert('Kamera simulasi. Fitur foto asli dapat ditambahkan nanti.')">●</button><div style="font-size:11px">Kamera belum mengambil foto</div></div>`;
 }else if(name==='Notes'){
 c.innerHTML=`<div style="font-size:12px;color:#8a7884;margin-bottom:10px">Catatan Baru</div><textarea class="noteinput" placeholder="Tulis catatan Aily di sini..."></textarea>`;
 }else if(name==='Browser'){
 c.innerHTML=`<div style="display:flex;gap:7px"><input id="browserSearch" placeholder="Cari atau masukkan alamat" style="min-width:0;flex:1;border:0;background:white;border-radius:20px;padding:12px"><button class="back" onclick="browse()">Go</button></div><p style="font-size:12px;color:#847282">Favorit</p>${btn('Google','browseTo(\\'https://www.google.com\\')')}${btn('YouTube','browseTo(\\'https://www.youtube.com\\')')}${btn('Pinterest','browseTo(\\'https://www.pinterest.com\\')')}<p style="font-size:11px;color:#8d7d8b">Halaman web dibuka di tab browser baru.</p>`;
 }else if(name==='Phone'){
 c.innerHTML=`<div style="text-align:center;padding:20px 0"><div style="font-size:48px">📞</div><h3>Telepon</h3><p style="color:#847282">Panggilan simulasi</p></div>${btn('Axel · 08•••••••','alert(\\'Panggilan simulasi ke Axel\\')')}${btn('Ibu · Kontak','alert(\\'Panggilan simulasi\\')')}`;
 }else if(name==='Mail'){
 c.innerHTML=`<h3>Inbox</h3><div class="rowbtn"><b>School</b><br><span style="font-size:12px;color:#827582">Pengingat tugas sekolah</span></div><div class="rowbtn"><b>Notifications</b><br><span style="font-size:12px;color:#827582">Tidak ada pesan baru</span></div>`;
 }else if(name==='Music'){
 c.innerHTML=`<div style="text-align:center;padding:25px 0"><div style="width:190px;height:190px;margin:auto;border-radius:22px;background:linear-gradient(145deg,#f8c5db,#b9a9e8);display:grid;place-items:center;font-size:70px">♫</div><h3 style="margin-bottom:3px">Now Playing</h3><div style="color:#847282;font-size:12px">Belum ada lagu diputar</div><p><button class="back" onclick="alert('Pemutar musik online bisa ditambahkan berikutnya.')">▶ Play</button></p></div>`;
 }else if(name==='Calendar'){
 c.innerHTML=`<h3 id="fullDate"></h3><div class="widget" style="background:white"><b>Agenda</b><p>Tidak ada acara hari ini.</p></div>`;$('fullDate').textContent=$('widgetDate').textContent;
 }else if(name==='Weather'){
 c.innerHTML=`<div style="text-align:center;padding:35px 0"><div style="font-size:70px">🌤️</div><h1 style="font-size:54px;margin:4px">28°</h1><div>Karawang</div><p style="color:#827582">Cerah berawan · perkiraan tampilan</p></div>`;
 }else if(name==='Contacts'){
 c.innerHTML=`<h3>Kontak</h3>${btn('Axel Zardian · Basket','alert(\\'Kontak Axel\\')')}${btn('Ibu','alert(\\'Kontak Ibu\\')')}${btn('Teman Sekolah','alert(\\'Kontak teman sekolah\\')')}`;
 }else if(name==='Alarm'){
 c.innerHTML=`<h2>Alarm</h2><div class="widget" style="background:white"><div style="font-size:32px">05:00</div><div style="font-size:12px;color:#827582">Setiap hari · simulasi</div></div>${btn('＋ Tambah alarm','alert(\\'Pengaturan alarm simulasi\\')')}`;
 }else if(name==='Settings'){
 c.innerHTML=`<h3>Pengaturan</h3>${btn('Wallpaper','alert(\\'Wallpaper Aily\\')')}${btn('Suara & Haptik','alert(\\'Pengaturan suara simulasi\\')')}${btn('Baterai · 87%','alert(\\'Status baterai simulasi\\')')}${btn('Tentang iPhone','alert(\\'iPhone Aily · The One Sunflower\\')')}`;
 }else{
 c.innerHTML=`<div style="text-align:center;padding:35px 0"><div style="font-size:55px">🌻</div><h2>The One Sunflower</h2><p>Vionata Aily & Axelio Zardian</p><p style="color:#827582">Basketball × Mayoret</p><p>Enemies. For now.</p></div>`;
 }
}
function closeApp(){$('modal').style.display='none'}
function browse(){const v=$('browserSearch').value.trim();if(v)browseTo(/^https?:\/\//i.test(v)?v:'https://www.google.com/search?q='+encodeURIComponent(v))}
function browseTo(url){window.open(url,'_blank','noopener')}
</script>
</body>
</html>
